<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ server_name }} 配信者一覧</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="page-header">
    <h1 class="page-title">{{ server_name }}</h1>
    <p class="page-subtitle">配信者一覧</p>
  </header>

  <main class="page-main">
    <h2 class="section-title">
      <span class="live-dot" aria-hidden="true"></span>
      NOW STREAMING
    </h2>

    <p id="status-note" class="status-note" role="status"></p>

    <div id="streamer-grid" class="grid">
      <p class="loading">読み込み中...</p>
    </div>

    <p class="hint">👆 配信中のアイコン・カードをクリックすると Twitch の配信ページへ移動します</p>
  </main>

  <footer class="page-footer">
    <p>ichibom Minecraft Server 非公式ポータル</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
